name: Auto Update Repositories List

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every day at midnight
  workflow_dispatch:      # Allows you to click "Run Workflow" manually anytime

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Update Script
        run: python update_readme.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-updated repository list in README" && git push)
